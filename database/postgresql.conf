# postgres_principal/postgresql.conf

# ------------------------------------------------------------------------------
# CONEXIONES Y AUTENTICACIÓN
# ------------------------------------------------------------------------------
listen_addresses = '*'          # IMPORTANTE: Permitir conexiones desde cualquier IP (Docker network)
max_connections = 200           # Keycloak + API + Workers consumen muchas conexiones
superuser_reserved_connections = 3

# ------------------------------------------------------------------------------
# MEMORIA (Ajustado para una VM modesta, sube estos valores si tienes RAM de sobra)
# ------------------------------------------------------------------------------
shared_buffers = 256MB          # Recomendado: 25% de la RAM total
work_mem = 4MB                  # Memoria por operación de ordenamiento
maintenance_work_mem = 64MB     # Memoria para mantenimientos (VACUUM, CREATE INDEX)

# ------------------------------------------------------------------------------
# LOGS (Write Ahead Log)
# ------------------------------------------------------------------------------
wal_level = replica
max_wal_size = 1GB
min_wal_size = 80MB

# ------------------------------------------------------------------------------
# LOCALIZACIÓN
# ------------------------------------------------------------------------------
timezone = 'America/Bogota'
lc_messages = 'en_US.utf8'      # Mensajes de error en inglés (más fácil de googlear)
lc_monetary = 'es_CO.utf8'
lc_numeric = 'es_CO.utf8'
lc_time = 'es_CO.utf8'
default_text_search_config = 'pg_catalog.spanish'
log_timezone = 'America/Bogota'

# ------------------------------------------------------------------------------
# LIBRERÍAS COMPARTIDAS (CRÍTICO PARA PARTMAN Y CRON)
# ------------------------------------------------------------------------------
shared_preload_libraries = 'pg_cron, pg_partman_bgw'
cron.database_name = 'InspectorDB'

# ------------------------------------------------------------------------------
# CONFIGURACIÓN DE PG_PARTMAN_BGW
# ------------------------------------------------------------------------------
pg_partman_bgw.interval = 3600       # Revisar particiones cada 1 hora (3600 seg)
pg_partman_bgw.role = 'postgres'     # Usuario dueño de las particiones
pg_partman_bgw.dbname = 'InspectorDB' # DB a mantener