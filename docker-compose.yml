version: '3.9'

services:
### ==========================================
### 1. APLICACIÓN PRINCIPAL (Backend & Frontend)
### ==========================================
  open_balena_apis:
    build:
      context: ./backend
    container_name: open_balena_apis
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    networks:
      InspecNet:
        ipv4_address: 172.10.0.2
    depends_on:
      - redis
      - postgres_principal

  frontend:
    build:
      context: ./frontend
    container_name: frontend
    restart: unless-stopped
    ports:
      - "3001:3000"
    depends_on:
      - redis
      - postgres_principal
    networks:
      InspecNet:
        ipv4_address: 172.10.0.4

### ==========================================
### 2. BASE DE DATOS Y CACHÉ
### ==========================================
  redis:
    image: redis:latest
    container_name: redis
    restart: unless-stopped
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    env_file:
      - ./backend/.env
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    networks:
      InspecNet:
        ipv4_address: 172.10.0.6
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data

  postgres_principal:
    build:
      context: ./database
    container_name: postgres_principal
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: ${TZ}
    env_file:
      - ./backend/.env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/postgresql.conf:/etc/postgresql/postgresql.conf
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./database/defaults_registers.sql:/docker-entrypoint-initdb.d/defaults_registers.sql
    restart: unless-stopped
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    networks:
      InspecNet:
        ipv4_address: 172.10.0.8
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

### ==========================================
### 3. SEGURIDAD (Keycloak & KrakenD)
### ==========================================
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_USER}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://172.10.0.8:5432/keycloak_db
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    ports:
      - "8080:8080"
    depends_on:
      postgres_principal:
        condition: service_healthy
    networks:
      InspecNet:
        ipv4_address: 172.10.0.10

  krakend:
    image: devopsfaith/krakend:2.6
    container_name: krakend
    restart: unless-stopped
    volumes:
      - ./gateway/krakend.json:/etc/krakend/krakend.json
    ports:
      - "8081:8080"
    depends_on:
      - keycloak
      - open_balena_apis
    networks:
      InspecNet:
        ipv4_address: 172.10.0.11

### ==========================================
### 4. VPN & GESTIÓN DE DISPOSITIVOS (WireGuard)
### ==========================================
  
  # El servidor VPN oficial con interfaz web
  wg-easy:
    image: weejewel/wg-easy:latest
    container_name: wg-easy
    restart: always
    ports:
      - "${WG_PORT:-51820}:51820/udp" # Puerto VPN
      - "${WG_EASY_PORT:-51821}:51821/tcp" # UI Web
    environment:
      - WG_HOST=${WG_HOST}
      - PASSWORD=${WG_EASY_PASSWORD}
      - WG_PORT=${WG_PORT:-51820}
      - WG_DEFAULT_ADDRESS=${WG_DEFAULT_ADDRESS}
      - WG_DEFAULT_ADDRESS_RANGE_SIZE=${WG_DEFAULT_ADDRESS_RANGE_SIZE:-24}
      - WG_DEFAULT_DNS=${WG_DEFAULT_DNS}
      - WG_ALLOWED_IPS=${WG_ALLOWED_IPS}
      - WG_MTU=${MTU:-1420}
      - TZ=${TZ:-America/Bogota}
      - WG_PERSISTENT_KEEPALIVE=25
      - MAX_CLIENTS=${WG_MAX_CLIENTS:-100}
    volumes:
      - ./wireguard_data/etc:/etc/wireguard
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
    networks:
      InspecNet:
        ipv4_address: 172.10.0.12

  # Tu API personalizada para controlar WireGuard
  wg-fastapi:
    build: 
      context: ./vpn  # <--- ASEGURATE DE QUE TU CÓDIGO DE WG-API ESTÉ EN ESTA CARPETA
    container_name: wg-fastapi-api
    restart: always
    expose:
      - "5000" # Puerto interno de la API de WG (Ojo: no confundir con el puerto 5000 de open_balena_apis)
    volumes:
      - ./wireguard_data/data:/data
      - /var/run/docker.sock:/var/run/docker.sock # Necesario para controlar el contenedor wg-easy
    environment:
      PYTHONUNBUFFERED: 1
      WG_API_PASSWORD: ${WG_API_PASSWORD}
      WG_EASY_PASSWORD: ${WG_EASY_PASSWORD}
      WG_INTERFACE: ${WG_INTERFACE:-wg0}
      WG_CONTAINER_NAME: wg-easy # Nombre del contenedor de arriba
      WG_EASY_HOST: 172.10.0.12  # IP directa del contenedor wg-easy
      WG_EASY_PORT: 51821
      DEVICES_DB: ${DEVICES_DB:-/data/devices.json}
      API_PORT: 5000
      WG_HOST: ${WG_HOST}
      WG_PORT: ${WG_PORT:-51820}
    depends_on:
      - wg-easy
    networks:
      InspecNet:
        ipv4_address: 172.10.0.13

networks:
  InspecNet:
    ipam:
      driver: default
      config:
        - subnet: 172.10.0.0/28

volumes:
  redis_data:
    driver: local
  pgdata:
    driver: local