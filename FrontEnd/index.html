<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <title>Inspector Milicon</title>
    <meta name="description" content="Gestión avanzada de dispositivos Milicon" />
    <!-- CSP: Protege contra XSS permitiendo scripts solo del propio dominio -->
    <!-- En desarrollo permitimos 'unsafe-inline' para vite, en producción se recomienda quitarlo o usar nonce -->
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; 
                   script-src 'self' 'unsafe-inline' 'unsafe-eval'; 
                   style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; 
                   img-src 'self' data: https: blob:; 
                   font-src 'self' https://fonts.gstatic.com data:; 
                   connect-src 'self' http://localhost:8081 http://localhost:8080 http://localhost:3000 ws://localhost:3000 http://keycloak:8080 http://localhost:5000;">


</head>

<body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>

</html>
